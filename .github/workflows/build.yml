name: Build Basalt Driver APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar el ICD
        run: |
          test -f app/src/main/jniLibs/arm64-v8a/libvulkan_panfrost.so || { echo "FALTA libvulkan_panfrost.so"; exit 1; }

      - name: Compilar shim (build limpia, arm64)
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          cmake -S shim -B shim/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release -DPANVK_SHIM_DIAG=0
          cmake --build shim/build --target vulkan_panvk_shim
          cp shim/build/libvulkan_panvk_shim.so app/src/main/jniLibs/arm64-v8a/
          echo "--- simbolos exportados (esperado: vkGetInstanceProcAddr y vkGetDeviceProcAddr) ---"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D --defined-only app/src/main/jniLibs/arm64-v8a/libvulkan_panvk_shim.so
          sha256sum app/src/main/jniLibs/arm64-v8a/*.so

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar APK
        run: |
          sed -i "s/\r$//" gradlew
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Mostrar contenido nativo del APK
        run: unzip -l app/build/outputs/apk/debug/*.apk | grep -E "lib/|AndroidManifest"

      - uses: actions/upload-artifact@v4
        with:
          name: basalt-driver-apk
          path: app/build/outputs/apk/debug/*.apk
